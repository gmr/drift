[package]
name = "drift"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Find the changes between two git refs that matter, ignoring the paths in .driftignore"
license = "BSD-3-Clause"
repository = "https://github.com/gmr/drift"
keywords = ["git", "drift", "cli", "gitops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
gix = { version = "0.86.0", features = ["blob-diff", "revision", "max-performance-safe"] }
ignore = "0.4.33"
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
