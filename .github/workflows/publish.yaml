name: Publish to crates.io

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag against the crate version
        run: |
          # cargo publish ships whatever Cargo.toml says, so refuse to publish under a
          # tag that names a different version than the manifest.
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '${version}'" >&2
            exit 1
          fi

      - name: Obtain crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1.0.4

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
