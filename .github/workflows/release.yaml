name: Release

on:
  release:
    # `created` also fires when a draft is saved, which would build and upload assets
    # for a release nobody can download yet, and would never fire again on publish.
    types: [published]

permissions: {}

jobs:
  build:
    # Only this job writes to the repository, to upload the release assets.
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag against the crate version
        run: |
          # cargo publish ships whatever Cargo.toml says, so a tag that disagrees with
          # the manifest would publish one version while the assets claim another.
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '${version}'" >&2
            exit 1
          fi

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked --version 0.2.5

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../drift-${{ matrix.target }}.tar.gz drift
          cd ../../..

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: drift-${{ matrix.target }}.tar.gz

  update-homebrew:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get release version
        id: version
        run: |
          # A git tag may hold shell-significant characters, and this value reaches a
          # shell and a commit message, so accept only a plain semver tag.
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing to release from tag '$GITHUB_REF_NAME': expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            url="https://github.com/gmr/drift/releases/download/${GITHUB_REF_NAME}/drift-${target}.tar.gz"
            curl -fsSL -o "drift-${target}.tar.gz" "$url"
            sha=$(sha256sum "drift-${target}.tar.gz" | cut -d' ' -f1)
            key=$(echo "${target}" | tr '-' '_')
            echo "${key}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: gmr/homebrew-utils
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_AARCH64_APPLE: ${{ steps.checksums.outputs.aarch64_apple_darwin }}
          SHA_X86_64_APPLE: ${{ steps.checksums.outputs.x86_64_apple_darwin }}
          SHA_AARCH64_LINUX: ${{ steps.checksums.outputs.aarch64_unknown_linux_gnu }}
          SHA_X86_64_LINUX: ${{ steps.checksums.outputs.x86_64_unknown_linux_gnu }}
        run: |
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/drift.rb
          sed -i "s|download/v[^/]*/|download/v${VERSION}/|g" Formula/drift.rb
          sed -i "/aarch64-apple-darwin/{n;s/sha256 \".*\"/sha256 \"${SHA_AARCH64_APPLE}\"/;}" Formula/drift.rb
          sed -i "/x86_64-apple-darwin/{n;s/sha256 \".*\"/sha256 \"${SHA_X86_64_APPLE}\"/;}" Formula/drift.rb
          sed -i "/aarch64-unknown-linux-gnu/{n;s/sha256 \".*\"/sha256 \"${SHA_AARCH64_LINUX}\"/;}" Formula/drift.rb
          sed -i "/x86_64-unknown-linux-gnu/{n;s/sha256 \".*\"/sha256 \"${SHA_X86_64_LINUX}\"/;}" Formula/drift.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/drift.rb
          git commit -m "Update drift to ${VERSION}"
          git push
